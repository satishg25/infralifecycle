---
# Thin entry point for a calling application (custom app / AAP job template): FLAT extra variables
# in, no profile, no request file, no framework dependency. Assumes the VM already exists and is
# in the inventory (their VM role or job runs first).
#
#   ansible-playbook playbooks/thin/tomcat_standalone.yml -i <inventory> -e @<vars file>
#   (check mode / preview)   ... --check --diff
#   (local lab)   ansible-playbook playbooks/thin/tomcat_standalone.yml -i ../examples/lab/inventory.yml -e @../examples/lab/tomcat_standalone.vars.yml
#
# Contract - everything is optional unless marked:
#   target_hosts                  inventory group or host pattern            (default: middleware_nodes)
#   run_baseline                  also apply rhel_baseline                   (default: false)
#   run_validation                run read-only Tomcat validation            (default: true)
#   run_os_validation             also run the OS validation role + evidence (default: true; needs run_validation)
#   rhel_baseline_ntp_servers     REQUIRED when run_baseline is true
#   rhel_baseline_data_volumes    list of {role, device, vg, lv, mount, fs}; device must be /dev/disk/by-*
#   tomcat_install_source         archive | rpm                              (default: archive)
#   tomcat_version / tomcat_archive_url / tomcat_archive_sha512   change together (default: pinned 10.1.x)
#   tomcat_bind_address           empty (loopback) or an IPv4 address
#   tomcat_http_port              1024-65535                                 (default: 8080)
#   tomcat_firewall_ports         e.g. ["8080/tcp"]                          (default: none)
#   (any other tomcat_* / rhel_baseline_* / validation_* role variable may also be passed)
- name: Validate the inputs before touching any host
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Check target_hosts is a plain inventory pattern
      ansible.builtin.assert:
        that: (target_hosts | default('middleware_nodes')) is match('^[A-Za-z0-9_.:*,&!-]+$')
        fail_msg: "target_hosts must be a plain inventory group/host pattern (letters, digits and _ . : * , & ! -), got '{{ target_hosts | default('') }}'"
        quiet: true

    - name: Check the boolean switches
      ansible.builtin.assert:
        that:
          - (run_baseline | default(false)) | string | lower in ['true', 'false']
          - (run_validation | default(true)) | string | lower in ['true', 'false']
          - (run_os_validation | default(true)) | string | lower in ['true', 'false']
        fail_msg: "run_baseline, run_validation and run_os_validation must be true or false"
        quiet: true

    - name: Check the baseline has the values it cannot default
      ansible.builtin.assert:
        that: not (run_baseline | default(false) | bool) or (rhel_baseline_ntp_servers | default([])) | length > 0
        fail_msg: "run_baseline is true, so rhel_baseline_ntp_servers is required (a non-empty list)"
        quiet: true

    - name: Check the install source
      ansible.builtin.assert:
        that: (tomcat_install_source | default('archive')) in ['archive', 'rpm']
        fail_msg: "tomcat_install_source must be archive or rpm, got '{{ tomcat_install_source | default('') }}'"
        quiet: true

- name: Apache Tomcat standalone
  hosts: "{{ target_hosts | default('middleware_nodes') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Apply the OS baseline (only when asked - the VM role may already do this)
      ansible.builtin.include_role:
        name: rhel_baseline
      when: run_baseline | default(false) | bool
      tags: [baseline]

    - name: Install and configure Tomcat
      ansible.builtin.include_role:
        name: tomcat
      tags: [tomcat]

    - name: Build the expected mount list from the data volumes
      ansible.builtin.set_fact:
        thin_expected_mounts: "{{ (thin_expected_mounts | default([])) + [{'path': item.mount, 'fstype': item.fs}] }}"
      loop: "{{ rhel_baseline_data_volumes | default([]) }}"
      loop_control:
        label: "{{ item.mount }}"
      when:
        - run_validation | default(true) | bool
        - run_os_validation | default(true) | bool
      tags: [validate]

    - name: Read-only OS validation and evidence report
      ansible.builtin.include_role:
        name: validation
      vars:
        validation_expected_mounts: "{{ thin_expected_mounts | default([]) }}"
      when:
        - run_validation | default(true) | bool
        - run_os_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]

    - name: Read-only Tomcat validation
      ansible.builtin.include_role:
        name: tomcat
        tasks_from: validate
      when:
        - run_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]
