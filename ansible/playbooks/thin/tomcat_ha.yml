---
# Thin entry point for a calling application (custom app / AAP job template): FLAT extra variables
# in, no profile, no request file, no framework dependency. Assumes the VMs already exist and are
# in the inventory (their VM role or job runs first).
#
# Active/active Tomcat: two or more identical Tomcat nodes, each with a unique jvmRoute, behind an
# Apache httpd load balancer (sticky sessions, a stopped node is skipped). Set
# run_load_balancer=false when the platform provides the balancer (F5, NetScaler, cloud LB) and
# point it at the nodes' bind address and /health/ instead.
# Sessions are NOT replicated between nodes: on a node failure its users log in again.
#
#   ansible-playbook playbooks/thin/tomcat_ha.yml -i <inventory> -e @<vars file>
#   (check mode / preview)   ... --check --diff
#   (local lab)   lab/run.sh tomcat_ha
#
# Contract - everything is optional unless marked:
#   target_hosts                  Tomcat nodes: inventory group or pattern, 2+ hosts (default: tomcat_nodes)
#   lb_hosts                      load balancer node(s)                       (default: tomcat_lb)
#   run_load_balancer             configure Apache httpd as the balancer      (default: true)
#   tomcat_bind_address           per node; default = the node's primary IPv4 (the balancer must reach it)
#   tomcat_jvm_route              per node; default = the inventory short name, made safe
#   tomcat_firewall_ports         on the nodes, e.g. ["8080/tcp"]             (default: none)
#   apache_httpd_listen_port      balancer port                               (default: 80)
#   apache_httpd_firewall_ports   on the balancer, e.g. ["80/tcp"]            (default: none)
#   apache_httpd_proxy_path       path to balance                             (default: /)
#   apache_httpd_proxy_retry      seconds before a failed node is retried     (default: 30)
#   run_baseline / rhel_baseline_*   as in the other thin playbooks           (default: false)
#   run_validation                read-only validation incl. both nodes serving through the balancer (default: true)
#   run_os_validation             also run the OS validation role + evidence  (default: true; needs run_validation)
#   (any other tomcat_* / apache_httpd_* / rhel_baseline_* / validation_* role variable may also be passed)
- name: Validate the inputs before touching any host
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Check the host patterns are plain inventory patterns
      ansible.builtin.assert:
        that:
          - (target_hosts | default('tomcat_nodes')) is match('^[A-Za-z0-9_.:*,&!-]+$')
          - (lb_hosts | default('tomcat_lb')) is match('^[A-Za-z0-9_.:*,&!-]+$')
        fail_msg: "target_hosts and lb_hosts must be plain inventory group/host patterns (letters, digits and _ . : * , & ! -)"
        quiet: true

    - name: Check there are at least two Tomcat nodes
      ansible.builtin.assert:
        that: query('ansible.builtin.inventory_hostnames', target_hosts | default('tomcat_nodes')) | length >= 2
        fail_msg: "target_hosts '{{ target_hosts | default('tomcat_nodes') }}' must match 2+ hosts for HA"
        quiet: true

    - name: Check the boolean switches
      ansible.builtin.assert:
        that:
          - (run_baseline | default(false)) | string | lower in ['true', 'false']
          - (run_validation | default(true)) | string | lower in ['true', 'false']
          - (run_os_validation | default(true)) | string | lower in ['true', 'false']
          - (run_load_balancer | default(true)) | string | lower in ['true', 'false']
        fail_msg: "run_baseline, run_validation, run_os_validation and run_load_balancer must be true or false"
        quiet: true

    - name: Check the baseline has the values it cannot default
      ansible.builtin.assert:
        that: not (run_baseline | default(false) | bool) or (rhel_baseline_ntp_servers | default([])) | length > 0
        fail_msg: "run_baseline is true, so rhel_baseline_ntp_servers is required (a non-empty list)"
        quiet: true

    - name: Check the install source
      ansible.builtin.assert:
        that: (tomcat_install_source | default('archive')) in ['archive', 'rpm']
        fail_msg: "tomcat_install_source must be archive or rpm, got '{{ tomcat_install_source | default('') }}'"
        quiet: true

- name: Apache Tomcat nodes
  hosts: "{{ target_hosts | default('tomcat_nodes') }}"
  become: true
  gather_facts: true
  tasks:
    # Per-node values, unless the caller set them (set_fact only fills what is undefined).
    - name: Default the bind address to the node's primary IPv4 (the balancer must reach it)
      ansible.builtin.set_fact:
        tomcat_bind_address: "{{ ansible_facts['default_ipv4']['address'] }}"
      when: tomcat_bind_address is not defined
      tags: [always]

    - name: Default the jvmRoute to the node's short name
      ansible.builtin.set_fact:
        tomcat_jvm_route: "{{ inventory_hostname_short | regex_replace('[^A-Za-z0-9_-]', '_') }}"
      when: tomcat_jvm_route is not defined
      tags: [always]

    - name: Check the node serves beyond loopback with a route
      ansible.builtin.assert:
        that:
          - tomcat_bind_address not in ['', '127.0.0.1']
          - tomcat_jvm_route | length > 0
        fail_msg: "Behind a balancer each node needs a reachable tomcat_bind_address and a tomcat_jvm_route"
        quiet: true
      tags: [always]

    - name: Check jvmRoutes are unique across the nodes
      ansible.builtin.assert:
        that: ansible_play_hosts_all | map('extract', hostvars, 'tomcat_jvm_route') | unique | length == ansible_play_hosts_all | length
        fail_msg: "tomcat_jvm_route must be unique per node: {{ ansible_play_hosts_all | map('extract', hostvars, 'tomcat_jvm_route') | list }}"
        quiet: true
      run_once: true

    - name: Apply the OS baseline (only when asked - the VM role may already do this)
      ansible.builtin.include_role:
        name: rhel_baseline
      when: run_baseline | default(false) | bool
      tags: [baseline]

    - name: Install and configure Tomcat
      ansible.builtin.include_role:
        name: tomcat
      tags: [tomcat]

    - name: Build the expected mount list from the data volumes
      ansible.builtin.set_fact:
        thin_expected_mounts: "{{ (thin_expected_mounts | default([])) + [{'path': item.mount, 'fstype': item.fs}] }}"
      loop: "{{ rhel_baseline_data_volumes | default([]) }}"
      loop_control:
        label: "{{ item.mount }}"
      when:
        - run_validation | default(true) | bool
        - run_os_validation | default(true) | bool
      tags: [validate]

    - name: Read-only OS validation and evidence report
      ansible.builtin.include_role:
        name: validation
      vars:
        validation_expected_mounts: "{{ thin_expected_mounts | default([]) }}"
      when:
        - run_validation | default(true) | bool
        - run_os_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]

    - name: Read-only Tomcat validation
      ansible.builtin.include_role:
        name: tomcat
        tasks_from: validate
      when:
        - run_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]

- name: Apache httpd load balancer in front of the Tomcat nodes
  hosts: "{{ (run_load_balancer | default(true) | bool) | ternary(lb_hosts | default('tomcat_lb'), 'localhost:!localhost') }}"
  become: true
  gather_facts: true
  vars:
    thin_tomcat_nodes: "{{ query('ansible.builtin.inventory_hostnames', target_hosts | default('tomcat_nodes')) }}"
    # The balancer's own health page must not shadow Tomcat's /health/, which is proxied.
    apache_httpd_health_context: lb-health
    apache_httpd_proxy_members: >-
      {%- set members = [] -%}
      {%- for h in thin_tomcat_nodes -%}
      {%- set _ = members.append({
            'route': hostvars[h]['tomcat_jvm_route'],
            'url': 'http://' ~ hostvars[h]['tomcat_bind_address'] ~ ':' ~ (hostvars[h]['tomcat_http_port'] | default(8080))}) -%}
      {%- endfor -%}
      {{ members }}
  tasks:
    - name: Apply the OS baseline (only when asked - the VM role may already do this)
      ansible.builtin.include_role:
        name: rhel_baseline
      when: run_baseline | default(false) | bool
      tags: [baseline]

    - name: Install and configure Apache httpd as the balancer
      ansible.builtin.include_role:
        name: apache_httpd
      tags: [apache_httpd]

    - name: Read-only Apache validation
      ansible.builtin.include_role:
        name: apache_httpd
        tasks_from: validate
      when:
        - run_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]

    # Through the balancer: every request must answer OK; with the route header on, every node
    # must have answered at least once (round robin over 2x the node count).
    - name: Query Tomcat's health page through the balancer
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ apache_httpd_listen_port | default(80) }}/{{ tomcat_health_context | default('health') }}/"
        return_content: true
        status_code: 200
      register: thin_lb_health
      loop: "{{ range(thin_tomcat_nodes | length * 2) | list }}"
      when:
        - run_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]

    - name: Assert the balancer serves OK from every node
      ansible.builtin.assert:
        that:
          - thin_lb_health.results | map(attribute='content') | map('trim') | unique == ['OK']
          - >-
            not (apache_httpd_proxy_route_header | default(false) | bool) or
            (thin_lb_health.results | map(attribute='x_backend_route') | unique | sort)
            == (apache_httpd_proxy_members | map(attribute='route') | sort)
        fail_msg: >-
          Balancer check failed: contents {{ thin_lb_health.results | map(attribute='content') | map('trim') | unique }},
          routes {{ thin_lb_health.results | map(attribute='x_backend_route', default='?') | unique }}
        quiet: true
      when:
        - run_validation | default(true) | bool
        - not ansible_check_mode
      tags: [validate]
