---
# --- Install source seam -----------------------------------------------------------------
# archive : Apache Tomcat tarball, checksum-pinned (implemented). Point tomcat_archive_url at the
#           internal artifact repo; tomcat_archive_sha512 must match what is served there.
# rpm     : JBoss Web Server from a Satellite-synced repo (placeholder - fails with a clear message)
# Switching later = change this one variable (plus the rpm_* vars) in the profile.
tomcat_install_source: archive

# --- Version (pinned; an upgrade changes these three together) -----------------------------
# The sha512 is the value Apache publishes next to the tarball (apache-tomcat-<v>.tar.gz.sha512).
tomcat_version: "10.1.60"
tomcat_archive_url: "https://archive.apache.org/dist/tomcat/tomcat-10/v{{ tomcat_version }}/bin/apache-tomcat-{{ tomcat_version }}.tar.gz"
tomcat_archive_sha512: "aa06508300ca137a023b74b8600f2c1b3248412eb85d4fc5e2f337c6c4d3776f4491e272f79856ac541cfab0fc35537111ae4f3cfcd0bbe702c0a3610a61bd04"

# --- Java (Tomcat 10.1 needs Java 11 or later) ----------------------------------------------
tomcat_java_package: java-17-openjdk-headless
tomcat_java_home: /usr/lib/jvm/jre-17

# --- Layout and service account --------------------------------------------------------------
# Each version unpacks to <base>/apache-tomcat-<version>; tomcat_home is a symlink to the active
# one, so an upgrade unpacks alongside and flips the link (rollback = flip it back).
tomcat_base_dir: /opt/tomcat
tomcat_home: "{{ tomcat_base_dir }}/current"
tomcat_user: tomcat
tomcat_group: tomcat
tomcat_service_name: tomcat

# --- RPM placeholders (used when tomcat_install_source: rpm) --------------------------------
tomcat_rpm_package: jws6-tomcat
tomcat_repo_hint: "the JBoss Web Server 6 repository (typically jws-6-for-rhel-8-x86_64-rpms) in the Satellite content view"

# --- Network exposure: secure by default ---------------------------------------------------
# Empty = loopback only. The shutdown port is ALWAYS disabled and AJP is never configured.
tomcat_bind_address: ""
tomcat_http_port: 8080
tomcat_firewall_ports: []              # e.g. ["8080/tcp"]; nothing opens unless the profile asks

# --- Hardening -----------------------------------------------------------------------------
tomcat_remove_default_webapps: true    # ROOT, docs, examples, manager, host-manager
tomcat_auto_deploy: false              # deploy at start-up only; no hot deploy from webapps/

# --- JVM -----------------------------------------------------------------------------------
tomcat_java_opts: "-Xms256m -Xmx512m"

# --- Health --------------------------------------------------------------------------------
# A one-file static context the role owns, so validation needs no application.
tomcat_health_context: health
tomcat_health_url: >-
  http://{{ (tomcat_bind_address in ['', '0.0.0.0']) | ternary('127.0.0.1', tomcat_bind_address) }}:{{ tomcat_http_port }}/{{ tomcat_health_context }}/
tomcat_start_timeout: 120
