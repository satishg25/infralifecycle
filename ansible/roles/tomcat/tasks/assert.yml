---
- name: Assert a supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
      - ansible_facts['distribution_major_version'] in ['8', '9']
    fail_msg: >-
      The tomcat role supports RHEL 8 or 9 (and rebuilds); found
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}
    quiet: true

- name: Assert the version is a plain x.y.z
  ansible.builtin.assert:
    that: tomcat_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "tomcat_version must look like 10.1.60, got '{{ tomcat_version }}'"
    quiet: true

- name: Assert the archive is pinned to an https URL and a full sha512
  ansible.builtin.assert:
    that:
      - tomcat_archive_url is match('^https://')
      - tomcat_archive_sha512 is match('^[0-9a-f]{128}$')
    fail_msg: >-
      tomcat_archive_url must be https and tomcat_archive_sha512 a 128-character hex sha512
      (no unverified downloads)
    quiet: true
  when: tomcat_install_source == 'archive'

- name: Assert the bind address, if set, is a plain IPv4 address
  ansible.builtin.assert:
    that: tomcat_bind_address == '' or tomcat_bind_address is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: "tomcat_bind_address must be empty or an IPv4 address, got '{{ tomcat_bind_address }}'"
    quiet: true

- name: Assert the HTTP port is unprivileged (the service never runs as root)
  ansible.builtin.assert:
    that: tomcat_http_port | int >= 1024 and tomcat_http_port | int <= 65535
    fail_msg: "tomcat_http_port must be 1024-65535, got {{ tomcat_http_port }}"
    quiet: true

- name: Assert the health context is a plain name
  ansible.builtin.assert:
    that: tomcat_health_context is match('^[A-Za-z0-9_-]+$')
    fail_msg: "tomcat_health_context must be letters, digits, _ or -, got '{{ tomcat_health_context }}'"
    quiet: true

- name: Assert firewall ports look like port/proto
  ansible.builtin.assert:
    that: item is match('^[0-9]{1,5}/(tcp|udp)$')
    fail_msg: "Bad firewall port '{{ item }}' - expected e.g. 8080/tcp"
    quiet: true
  loop: "{{ tomcat_firewall_ports }}"
