---
argument_specs:
  apply:
    short_description: Create (idempotently) a private-IP-only RHEL VM in Azure and return machine_result.v1
    options: &opts
      cap_spec:
        type: dict
        required: true
        options:
          contract: {type: str, required: true, choices: [machine_spec.v1]}
          name: {type: str, required: true}
          cpu: {type: int, required: true}
          memory_gb: {type: int, required: true}
          image_ref: {type: str, required: true}
          placement_ref: {type: str, required: true}
          network_ref: {type: str, required: true}
          disks: {type: list, elements: dict, required: true}
          tags: {type: dict, required: true}
          native: {type: dict, required: false}
      cap_cfg:
        type: dict
        required: true
        options:
          subscription_id: {type: str, required: true}
          auth_source: {type: str, required: false, choices: [auto, cli, env, msi, credential_file]}
          resource_group: {type: str, required: true}
          domain: {type: str, required: true}
          admin_username: {type: str, required: true}
          admin_ssh_public_key: {type: str, required: true}
          vm_size_map: {type: dict, required: true}
          os_disk_type: {type: str, required: false, choices: [Standard_LRS, StandardSSD_LRS, StandardSSD_ZRS, Premium_LRS, Premium_ZRS]}
          data_disk_type: {type: str, required: false, choices: [Standard_LRS, StandardSSD_LRS, StandardSSD_ZRS, Premium_LRS, Premium_ZRS]}
          os_disk_caching: {type: str, required: false, choices: [None, ReadOnly, ReadWrite]}
          data_disk_caching: {type: str, required: false, choices: [None, ReadOnly, ReadWrite]}
          encryption_at_host: {type: bool, required: false}
          system_assigned_identity: {type: bool, required: false}
          license_type: {type: str, required: false, choices: [RHEL_BYOS]}
  validate:
    short_description: Confirm the VM exists, is running and is owned by this platform
    options: *opts
  revert:
    short_description: Delete the VM, disks and NIC - only when tagged as owned by this request
    options: *opts
